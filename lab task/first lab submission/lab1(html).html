<html>
	<head>
		<title>Student Information Desk</title>
		<link rel = "stylesheet" href = "lab1(css).css">
	</head>
	<body>
		<h1>Student Information</h1>
		<form>
			<div>
				<label for = "name">Student Name:</label>
				<input type = "text" id = "name" required>
			</div>
			<div>
				<label for = "password">Password:</label>
				<input type = "password" id = "password" required>
			</div>
			<div>
				<label for = "email">E-mail:</label>
				<input type = "email" id = "email">
			</div>
			<div>
				<label for = "dob">Date of Birth:</label>
				<input type = "date" id = "dob">
			</div>
			</div>
				<label for = "age">Age:</label>
				<input type = "number" id = "age">
			<div>
				<label for = "cgpa">CGPA:</label>
				<input type = "text" id = "cgpa">
			</div>
			<div>
				<label for = "status">Student Status:</label>
				<input type = "radio" name = "status" value = "Valid" checked>Valid
				<input type = "radio" name = "status" value = "Invalid">Invalid
			</div>
			<div>
				<label for = "interest">Area of Interest:</label>
				<input type = "checkbox" name = "interest" value = "CP">CP
				<input type = "checkbox" name = "interest" value = "r&d">R&D
				<input type = "checkbox" name = "interest" value = "swd">Software Development
				<input type = "checkbox" name = "interest" value = "AI&ML">AI/ML
			</div>
			<div>
				<label for = "grade">Grade:</label>
				<select name = "grade">
					<option value = "A+">A+</option>
					<option value = "A">A</option>
					<option value = "B+">B+</option>
					<option value = "B">B</option>
					<option value = "C+">C+</option>
					<option value = "C">C</option>
					<option value = "D+">D+</option>
					<option value = "D">D</option>
					<option value = "F">F</option>
				</select>
			</div>
			<div>
				<input type = "submit" value = "Submit Information">
			</div>
		</form><hr style = "border: 1px solid black;">
	</body>
</html>
